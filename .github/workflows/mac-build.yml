# Builds the macOS release files on this public repo's free macOS runners.
# The private source is checked out only inside the job (read-only deploy key);
# nothing from it is committed, cached or logged. Build output goes to a file
# that is never uploaded; a failure prints only rustc/make error lines.
# Started only by maintainers (workflow_dispatch); no PR or fork trigger.
name: mac-build
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag in the private build repo (v0.1.2)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: mac-build-${{ inputs.version }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    environment: release-build
    steps:
      - name: Check version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ $VERSION =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::version must look like v1.2.3"; exit 1; }
          echo "BARE=${VERSION#v}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gethandup/handup-build
          ref: refs/tags/${{ inputs.version }}
          ssh-key: ${{ secrets.HANDUP_BUILD_DEPLOY_KEY }}
          persist-credentials: false
          path: src
      - name: Read pinned tool versions
        working-directory: src
        run: |
          for k in NODE_VERSION PNPM_VERSION GO_VERSION TAURI_CLI_VERSION CARGO_BINSTALL_VERSION; do
            v=$(sed -nE "s/^  $k: *\"?([^\"]+)\"?$/\1/p" .github/workflows/release.yml)
            [[ -n $v ]] || { echo "::error::$k missing from release.yml"; exit 1; }
            echo "$k=$v" >> "$GITHUB_ENV"
          done
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install toolchain
        timeout-minutes: 15
        run: |
          corepack enable && corepack prepare "pnpm@$PNPM_VERSION" --activate
          rustup update stable --no-self-update && rustup default stable
          mkdir -p "$RUNNER_TEMP/bin" && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          curl -fsSL -o "$RUNNER_TEMP/binstall.zip" "https://github.com/cargo-bins/cargo-binstall/releases/download/v$CARGO_BINSTALL_VERSION/cargo-binstall-aarch64-apple-darwin.zip"
          unzip -q -d "$RUNNER_TEMP/bin" "$RUNNER_TEMP/binstall.zip" cargo-binstall
          "$RUNNER_TEMP/bin/cargo-binstall" -y --force --locked "tauri-cli@$TAURI_CLI_VERSION" > /dev/null
      - name: Build
        timeout-minutes: 45
        working-directory: src
        env:
          CARGO_TERM_COLOR: never
        run: |
          log="$RUNNER_TEMP/build.log"
          if ! make release-macos BUILD_VERSION="$BARE" RELEASE_DIR="$GITHUB_WORKSPACE/out" > "$log" 2>&1; then
            # Error headlines only: no source snippets or file contents.
            grep -E '^(error(\[E[0-9]+\])?: |make(\[[0-9]+\])?: \*\*\*)' "$log" | cut -c1-200 | head -20
            exit 1
          fi
          ls -l "$GITHUB_WORKSPACE/out"
      - name: Remove source
        if: always()
        run: rm -rf src
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos
          path: out/
          if-no-files-found: error
          retention-days: 1
